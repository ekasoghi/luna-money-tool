<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Luna Money Tool</title>
<meta name="description" content="Luna Money Tool — kelola arus kas pribadi dan usaha: pemasukan, pengeluaran, scan nota, anggaran, dan laporan harian, mingguan, bulanan, tahunan.">
<meta name="theme-color" content="#0B1530">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Luna Money">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: sidebar kiri di laptop, bottom-nav + tombol scan di HP. Satu tema gelap navy, aksen cahaya bulan. */
:root{
  --bg:#0A1430; --bg-2:#0E1A3C; --surface:#122147; --surface-2:#182A57; --line:#24396B; --line-2:#2F4780;
  --fg:#EAF0FB; --muted:#93A3C6; --dim:#6577A3;
  --moon:#E2CB8C; --moon-2:#F2E2B3; --moon-ink:#1A1608;
  --in:#5CD3A6; --out:#F2867A; --warn:#F1B95A; --info:#7FA8F5;
  --display:"DM Serif Display",Georgia,"Times New Roman",serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1200px 600px at 85% -10%,#1A2E66 0%,transparent 60%),var(--bg);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--moon);outline-offset:2px;border-radius:6px}
svg.lucide{width:18px;height:18px;stroke-width:1.9;flex:none}
body.locked .app, body.locked .bottom{display:none}

/* ---------- shell ---------- */
.app{display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0;padding:calc(12px + var(--safe-t)) 16px calc(96px + var(--safe-b))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.moon{width:30px;height:30px;border-radius:50%;background:var(--moon);position:relative;overflow:hidden;flex:none;box-shadow:0 0 24px rgba(226,203,140,.35)}
.moon::after{content:"";position:absolute;width:30px;height:30px;border-radius:50%;background:var(--bg);left:9px;top:-5px}
.brand b{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.2px}
.brand small{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:-4px}
.seg{display:inline-flex;background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:6px 13px;border-radius:999px;color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--bg-2);display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{color:var(--fg);border-color:var(--line-2)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block}
.sync-dot.on{background:var(--in);box-shadow:0 0 8px var(--in)}
.sync-dot.err{background:var(--out)}
.avatar{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:700;background:linear-gradient(160deg,#24396B,#182A57);border:1px solid var(--line-2);color:var(--moon);flex:none}

.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(10,20,48,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:6px 8px calc(6px + var(--safe-b));display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.bottom button{border:0;background:none;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;padding:6px 0}
.bottom button[aria-current="page"]{color:var(--moon)}
.bottom .scan span.fab{width:54px;height:54px;border-radius:18px;background:linear-gradient(160deg,var(--moon-2),var(--moon));display:grid;place-items:center;margin-top:-26px;box-shadow:0 8px 24px rgba(226,203,140,.3)}
.bottom .scan span.fab svg{width:24px;height:24px;color:var(--moon-ink)}
.bottom .scan em{font-style:normal;color:var(--moon)}

@media (min-width:960px){
  .side{display:flex;flex-direction:column;gap:6px;width:248px;flex:none;position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid var(--line);background:rgba(8,16,40,.55)}
  .side .brand{margin:0 0 18px 6px}
  .side nav{display:flex;flex-direction:column;gap:2px}
  .side nav button{display:flex;align-items:center;gap:12px;border:0;background:none;color:var(--muted);padding:10px 12px;border-radius:11px;font-weight:600;text-align:left}
  .side nav button:hover{background:var(--bg-2);color:var(--fg)}
  .side nav button[aria-current="page"]{background:var(--surface);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
  .side nav button[aria-current="page"] svg{color:var(--moon)}
  .side .cta{margin-top:14px;display:grid;gap:8px}
  .side .foot{margin-top:auto;font-size:12px;color:var(--dim);padding:0 6px;display:flex;flex-direction:column;gap:8px}
  .bottom{display:none}
  .main{padding:26px 32px 48px}
  .topbar .brand{display:none}
}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);padding:10px 15px;font-weight:600;color:var(--fg)}
.btn:hover{border-color:var(--moon)}
.btn.primary{background:linear-gradient(160deg,var(--moon-2),var(--moon));color:var(--moon-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:var(--out);border-color:rgba(242,134,122,.4);background:transparent}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;pointer-events:none}
.link{background:none;border:0;color:var(--moon);font-weight:600;padding:0;text-decoration:underline;text-underline-offset:3px}
.card{background:linear-gradient(180deg,var(--surface) 0%,rgba(18,33,71,.82) 100%);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card h3{margin:0 0 12px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .right{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600}
.grid{display:grid;gap:16px;align-items:start}
.g2{grid-template-columns:1fr}
.g3{grid-template-columns:1fr}
@media (min-width:720px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}
.g-main{grid-template-columns:1fr}
@media (min-width:1100px){.g-main{grid-template-columns:1.6fr 1fr}}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.in{color:var(--in)} .out{color:var(--out)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.pill.in{color:var(--in);border-color:rgba(92,211,166,.35);background:rgba(92,211,166,.08)}
.pill.out{color:var(--out);border-color:rgba(242,134,122,.35);background:rgba(242,134,122,.08)}
.pill.warn{color:var(--warn);border-color:rgba(241,185,90,.35);background:rgba(241,185,90,.08)}
.pill.biz{color:var(--info);border-color:rgba(127,168,245,.35)}
.pill.moon{color:var(--moon);border-color:rgba(226,203,140,.4)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.input,select.input,textarea.input{width:100%;background:var(--bg-2);border:1px solid var(--line);border-radius:11px;padding:11px 12px;outline:none;min-width:0}
.input:focus{border-color:var(--moon)}
.input.bad{border-color:var(--out)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted)}
.check input{margin-top:3px;accent-color:var(--moon);width:16px;height:16px;flex:none}
.err{color:var(--out);font-size:13px;font-weight:600;min-height:1em}
.ok{color:var(--in);font-size:13px;font-weight:600}

/* ---------- period bar ---------- */
.period{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.period .nav{display:flex;align-items:center;gap:6px}
.period .label{font-family:var(--display);font-size:24px;min-width:0;line-height:1.15}
.period .nav .icon-btn{width:34px;height:34px}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;padding:22px}
.hero::before{content:"";position:absolute;right:-60px;top:-80px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(242,226,179,.22),rgba(226,203,140,.04) 60%,transparent 70%)}
.hero .k{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;position:relative}
.hero .big{font-family:var(--display);font-size:clamp(34px,6vw,48px);line-height:1.05;margin:6px 0 4px;word-break:break-word;position:relative}
.hero .sub{color:var(--muted);font-size:13px;position:relative}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;position:relative}
.split .box{background:rgba(10,20,48,.55);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.split .box .t{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.split .box .v{font-size:clamp(14px,4.2vw,19px);font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:720px){.stat-row{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.stat .t{font-size:11.5px;color:var(--muted);font-weight:600}
.stat .v{font-size:clamp(15px,4vw,18px);font-weight:700;margin-top:2px;word-break:break-word}
.stat .h{font-size:11.5px;margin-top:2px}
.quick{display:flex;gap:8px}
.quick .input{flex:1}
.chart-box{position:relative;height:240px}
.chart-box.sm{height:210px}
@media (max-width:440px){.brand small{display:none}.topbar .seg button{padding:6px 10px}.topbar{gap:8px}.split .box{padding:10px}.period .label{font-size:21px}}

/* ---------- lists ---------- */
.tx-day{display:flex;justify-content:space-between;align-items:baseline;padding:14px 2px 6px;font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.03em;border-bottom:1px solid var(--line);gap:10px}
.tx{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid rgba(36,57,107,.55);cursor:pointer;border-radius:10px}
.tx:hover{background:rgba(24,42,87,.6)}
.cat-ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.tx .mid{flex:1;min-width:0}
.tx .mid .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .mid .t2{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.tx .amt{font-weight:700;text-align:right;white-space:nowrap}
.tx .amt small{display:block;font-weight:500;font-size:11px;color:var(--dim)}
.bar{height:8px;border-radius:999px;background:var(--bg-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:999px}
.catrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(36,57,107,.5)}
.catrow:last-child{border-bottom:0}
.catrow .nm{font-weight:600;display:flex;justify-content:space-between;gap:8px;margin-bottom:5px;font-size:13.5px}
.catrow .nm span:last-child{color:var(--muted);font-weight:500}
.insight{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid rgba(36,57,107,.5)}
.insight:last-child{border-bottom:0}
.insight .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--bg-2);border:1px solid var(--line)}
.insight .ic.good{color:var(--in)} .insight .ic.bad{color:var(--out)} .insight .ic.warn{color:var(--warn)} .insight .ic.info{color:var(--moon)}
.insight p{margin:0;font-size:13.5px}
.insight .s{color:var(--muted);font-size:12.5px;margin-top:2px}

.tbl-wrap{overflow-x:auto;margin:0 -4px}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
.tbl th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 6px;border-bottom:1px solid rgba(36,57,107,.5)}
.tbl td.r,.tbl th.r{text-align:right;white-space:nowrap}
.tbl tr.total td{font-weight:700;border-top:1px solid var(--line-2);border-bottom:0}
.tbl tr.quiet td{color:var(--dim)}
.pl{display:flex;flex-direction:column}
.pl .ln{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed rgba(47,71,128,.6)}
.pl .ln.sub{padding-left:14px;color:var(--muted);font-size:13px}
.pl .ln.head{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--moon);font-weight:700;border-bottom:0;padding-top:14px}
.pl .ln.tot{font-weight:700;border-bottom:1px solid var(--line-2)}
.pl .ln.grand{font-family:var(--display);font-size:22px;border:0;padding-top:12px}
.pl .ln span:last-child{white-space:nowrap}

/* ---------- sheet / modal ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(3,8,22,.66);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--bg-2);border:1px solid var(--line-2);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + var(--safe-b));animation:up .22s ease}
@media (min-width:720px){.overlay{align-items:center}.sheet{border-radius:20px;padding:22px}}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sheet-h h2{margin:0;font-family:var(--display);font-weight:400;font-size:24px;margin-right:auto}
.type-tog{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.type-tog button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
.type-tog button.on.out{color:var(--out);border-color:var(--out);background:rgba(242,134,122,.08)}
.type-tog button.on.in{color:var(--in);border-color:var(--in);background:rgba(92,211,166,.08)}
.amount-in{font-family:var(--display);font-size:34px;background:transparent;border:0;border-bottom:1px solid var(--line-2);width:100%;padding:6px 0;outline:none}
.amount-in:focus{border-color:var(--moon)}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.cat-grid button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--muted);line-height:1.2;text-align:center}
.cat-grid button.on{border-color:var(--moon);color:var(--fg);background:var(--surface-2)}
.cat-grid .cat-ico{width:30px;height:30px;border-radius:9px}
.cat-grid .cat-ico svg{width:16px;height:16px}
.suggest{font-size:12px;color:var(--moon);display:inline-flex;gap:6px;align-items:center}
.form{display:flex;flex-direction:column;gap:14px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.f2{grid-template-columns:1fr}}
.receipt-prev{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.receipt-prev img{width:64px;height:64px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
.items{font-size:12.5px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.items div{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;border-bottom:1px solid rgba(36,57,107,.5)}
.items div:last-child{border-bottom:0}
.scan-stage{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.scan-img{border-radius:14px;border:1px solid var(--line);max-height:46vh;object-fit:contain;background:#050b1c;width:100%}
.progress{height:6px;border-radius:999px;background:var(--surface);overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--moon),var(--moon-2));width:0;transition:width .2s}
.source{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:520px){.source{grid-template-columns:1fr 1fr}}
.source button{border:1px solid var(--line-2);background:var(--surface);border-radius:16px;padding:18px 16px;text-align:left;display:flex;flex-direction:column;gap:8px;color:var(--fg)}
.source button:hover{border-color:var(--moon)}
.source button .ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:rgba(226,203,140,.12);color:var(--moon)}
.source button .ic svg{width:22px;height:22px}
.source button b{font-size:15px}
.source button span{font-size:12.5px;color:var(--muted)}
.drop{border:1.5px dashed var(--line-2);border-radius:14px;padding:16px;text-align:center;color:var(--muted);font-size:13px}
.drop.over{border-color:var(--moon);color:var(--fg);background:rgba(226,203,140,.06)}
.queue-pill{font-size:12px;color:var(--moon);font-weight:700}

/* ---------- gate (login/registrasi) ---------- */
.gate{position:fixed;inset:0;z-index:80;overflow:auto;background:radial-gradient(900px 520px at 80% -10%,#1E3576 0%,transparent 60%),radial-gradient(700px 500px at -10% 110%,#13285E 0%,transparent 60%),var(--bg);
  padding:calc(24px + var(--safe-t)) 16px calc(24px + var(--safe-b));display:flex;justify-content:center;align-items:flex-start}
@media (min-height:760px){.gate{align-items:center}}
.gate-card{width:100%;max-width:430px;display:flex;flex-direction:column;gap:18px}
.gate-brand{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.gate-brand .moon{width:64px;height:64px;box-shadow:0 0 60px rgba(226,203,140,.45)}
.gate-brand .moon::after{width:64px;height:64px;left:19px;top:-10px}
.gate-brand h1{margin:0;font-family:var(--display);font-weight:400;font-size:34px;line-height:1}
.gate-brand p{margin:0;color:var(--muted);font-size:13.5px;max-width:34ch}
.gate .card{padding:22px;background:rgba(14,26,60,.86);backdrop-filter:blur(10px)}
.gate h2{margin:0 0 4px;font-family:var(--display);font-weight:400;font-size:24px}
.gate .tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:16px}
.gate .tabs button{border:0;background:none;padding:9px;border-radius:9px;color:var(--muted);font-weight:700}
.gate .tabs button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.acc-list{display:flex;flex-direction:column;gap:8px}

function norm(s){return (" "+String(s||"").toLowerCase().replace(/[^a-z0-9&.\- ]+/g," ").replace(/\s+/g," ")+" ")}
function classify(text, book, type){
  const t = norm(text), key=t.trim();
  for (const [k,v] of Object.entries(state.profile.rules||{})) {
    if (k && (t.includes(" "+k+" ") || key.startsWith(k))) { const c=CAT[v]; if (c && c.b===book && (!type || c.t===type)) return {id:v,src:"belajar"}; }
  }
  let best=null, bestLen=0;
  const scan=(bk)=>{for (const [cid,words] of Object.entries(RULES[bk])) {
    const c=CAT[cid]; if (type && c.t!==type) continue;
    for (const w of words){ const ww=w.trim(); const hit = ww.length<=4 ? t.includes(" "+ww+" ") : t.includes(w);
      if (hit && ww.length>bestLen){ best=cid; bestLen=ww.length; } }
  }};
  scan(book);
  if (!best && book==="business") { scan("personal"); if (best) best = PERSONAL_TO_BIZ[best] || null; }
  if (best && CAT[best] && CAT[best].b===book) return {id:best,src:"otomatis"};
  return null;
}

  const k = norm(text).trim().split(" ").slice(0,3).join(" ");

  state.profile.rules = state.profile.rules || {};
  state.profile.rules[k] = catId;
}

const enc=new TextEncoder(), dec=new TextDecoder();
const KDF_ITER=600000;
function b64(buf){const u=buf instanceof Uint8Array?buf:new Uint8Array(buf);let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
function unb64(s){const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
const rand=n=>crypto.getRandomValues(new Uint8Array(n));
async function kdf(secret,saltB64,iter=KDF_ITER){
  const base=await crypto.subtle.importKey("raw",enc.encode(secret),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:unb64(saltB64),iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function seal(key,bytes){const iv=rand(12);const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,bytes);return {iv:b64(iv),ct:b64(ct)}}
async function unseal(key,box){return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(box.iv)},key,unb64(box.ct)))}
async function newDataKey(){const raw=rand(32);const key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["encrypt","decrypt"]);return {raw,key}}
async function wrapRaw(raw,secret){const salt=b64(rand(16));const kek=await kdf(secret,salt);return {salt,iter:KDF_ITER,box:await seal(kek,raw)}}
async function unwrapRaw(w,secret){const kek=await kdf(secret,w.salt,w.iter||KDF_ITER);const raw=await unseal(kek,w.box);return {raw,key:await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["encrypt","decrypt"])}}
function recoveryCode(){const A="ABCDEFGHJKMNPQRSTUVWXYZ23456789";const r=rand(16);let s="";for(let i=0;i<16;i++){s+=A[r[i]%A.length];if(i%4===3&&i<15)s+="-"}return s}

function pwStrength(p){let s=0;if(p.length>=8)s++;if(p.length>=12)s++;if(/[a-z]/i.test(p)&&/\d/.test(p))s++;if(/[^a-z0-9]/i.test(p)||(/[a-z]/.test(p)&&/[A-Z]/.test(p)))s++;return Math.min(4,s)}

let persistTimer=null, persistChain=Promise.resolve();
function persistNow(){
  clearTimeout(persistTimer);
  if(!Auth.key||!Auth.acc) return persistChain;
  const key=Auth.key, id=Auth.acc.id, json=JSON.stringify({tx:state.tx,profile:state.profile,v:2});
  persistChain=persistChain.then(async()=>{const box=await seal(key,enc.encode(json));try{localStorage.setItem("luna.data."+id,JSON.stringify(box))}catch(e){toast("Penyimpanan perangkat penuh. Ekspor data lalu hapus foto nota lama.")}}).catch(e=>console.error(e));
  return persistChain;
}
function save(changedMonths){
  if (changedMonths) changedMonths.forEach(m=>Sync.dirty.add(m));
  Sync.dirtyProfile = true;
  clearTimeout(persistTimer); persistTimer=setTimeout(persistNow,250);
  clearTimeout(Sync.timer); Sync.timer=setTimeout(()=>Sync.push(),1500);
}

async function migrateLegacy(){
  // data dari versi pertama (belum terenkripsi)
  const raw=localStorage.getItem("luna.v1"); if(!raw) return 0;
  const d=JSON.parse(raw); let n=0;
  for(const t of Object.values(d.tx||{})){ if(!state.tx[t.id]){ if(t.r){const b=await IDB.getRaw(t.r);if(b instanceof Blob){await IDB.put(t.r,b);await IDB.delRaw(t.r)}else t.r=null} state.tx[t.id]=t; n++ } }

  localStorage.removeItem("luna.v1");
  save([...new Set(liveTx().map(t=>t.d.slice(0,7)))]); await persistNow();
  return n;
}

async function compressImage(file,max=1280,q=.72){
  const bmp = await createImageBitmap(file).catch(()=>null);
  if(!bmp) return file;
  const s=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas");c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",q));
}

const Sync = {
  client:null, user:null, status:"local", dirty:new Set(), dirtyProfile:false, busy:false, timer:null, recovery:false,
  async loadLib(){ if(window.supabase) return; await new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.js";s.onload=res;s.onerror=()=>rej(new Error("Tidak bisa memuat layanan cloud. Periksa koneksi internet."));document.head.appendChild(s)}) },
  async ensure(){
    if(!CLOUD) throw new Error("Akun cloud belum diaktifkan oleh pemilik aplikasi.");
    if(this.client) return this.client;
    await this.loadLib();
    this.client=supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey,{auth:{persistSession:true,storageKey:"luna-auth",detectSessionInUrl:true,autoRefreshToken:true}});
    this.client.auth.onAuthStateChange((ev,session)=>{ if(ev==="PASSWORD_RECOVERY"){this.recovery=true;Gate.show("reset-cloud",{email:session?.user?.email})} });

  },
  set(s){this.status=s;const txt={local:"Terenkripsi di perangkat",on:"Tersinkron ke cloud",login:"Cloud: masuk ulang untuk sinkron",err:"Sinkron bermasalah, coba lagi",busy:"Menyinkronkan…"}[s]||"";
    const d=$("#syncDot"),t=$("#syncText");if(d)d.className="sync-dot"+(s==="on"?" on":s==="err"?" err":"");if(t)t.textContent=txt},
  async afterOpen(){
    if(!(Auth.acc&&Auth.acc.kind==="cloud")){this.set("local");return}
    try{await this.ensure();const {data}=await this.client.auth.getSession();const u=data.session?.user;
      if(u&&u.id===Auth.acc.cloudUid){this.user=u;await this.pull();liveTx().length&&this.markAll();await this.push()}
      else{this.user=null;this.set("login")}
    }catch(e){console.warn(e);this.set("err")}
  },
  markAll(){new Set(Object.values(state.tx).map(t=>t.d.slice(0,7))).forEach(m=>this.dirty.add(m));this.dirtyProfile=true},
  async pull(){
    if(!this.client||!this.user||!Auth.key) return;
    this.set("busy");
    const {data,error}=await this.client.from("luna_data").select("key,data").eq("user_id",this.user.id);
    if(error){console.warn(error);this.set("err");return}
    let changed=false;
    for(const row of data){
      if(row.key==="profile"){const p=row.data||{};if((p.updatedAt||0)>(state.profile.updatedAt||0)){state.profile=Object.assign(blankProfile(),state.profile,p);changed=true}}
      else if(row.key.startsWith("m:")){for(const t of (row.data?.tx||[])){const cur=state.tx[t.id];if(!cur||(t.u||0)>(cur.u||0)){state.tx[t.id]=t;changed=true}}}
    }
    if(changed){await persistNow();render()}
    this.set("on");
  },
  async push(){
    if(!this.client||!this.user||this.busy||!Auth.key) return;
    if(!this.dirty.size && !this.dirtyProfile) return;
    this.busy=true; this.set("busy");
    try{
      const rows=[], now=new Date().toISOString();
      for(const m of this.dirty) rows.push({user_id:this.user.id,key:"m:"+m,data:{tx:Object.values(state.tx).filter(t=>t.d.slice(0,7)===m)},updated_at:now});
      if(this.dirtyProfile) rows.push({user_id:this.user.id,key:"profile",data:state.profile,updated_at:now});
      const {error}=await this.client.from("luna_data").upsert(rows,{onConflict:"user_id,key"});
      if(error) throw error;
      this.dirty.clear(); this.dirtyProfile=false; this.set("on");
    }catch(e){console.warn(e);this.set("err")}
    finally{this.busy=false}
  }
};

/* ---------------- Periode ---------------- */
const MODES=[["day","Harian"],["week","Mingguan"],["month","Bulanan"],["year","Tahunan"]];
function range(mode,anchor){
  const d=parseYmd(anchor);
  if(mode==="day") return {start:anchor,end:anchor,label:fmtDateLong(anchor),days:1};
  if(mode==="week"){const wd=(d.getDay()+6)%7;const s=new Date(d);s.setDate(d.getDate()-wd);const e=new Date(s);e.setDate(s.getDate()+6);
    const lab=`${s.getDate()}${s.getMonth()!==e.getMonth()?" "+BLN3[s.getMonth()]:""} – ${e.getDate()} ${BLN3[e.getMonth()]} ${e.getFullYear()}`;
    return {start:ymd(s),end:ymd(e),label:lab,sub:"Pekan ke-"+isoWeek(s),days:7}}
  if(mode==="year"){const y=d.getFullYear();return {start:y+"-01-01",end:y+"-12-31",label:"Tahun "+y,days:(y%4===0?366:365)}}
  const y=d.getFullYear(),m=d.getMonth(),last=new Date(y,m+1,0).getDate();
  return {start:`${y}-${pad(m+1)}-01`,end:`${y}-${pad(m+1)}-${pad(last)}`,label:BLN[m]+" "+y,days:last};
}
function shift(mode,anchor,n){const d=parseYmd(anchor);
  if(mode==="day") d.setDate(d.getDate()+n); else if(mode==="week") d.setDate(d.getDate()+7*n); else if(mode==="year") d.setFullYear(d.getFullYear()+n); else {d.setDate(1);d.setMonth(d.getMonth()+n)}
  return ymd(d)}
function elapsedDays(r){const t=today();if(t<r.start)return 0;if(t>r.end)return r.days;return Math.round((parseYmd(t)-parseYmd(r.start))/864e5)+1}
function inBook(t,book){return book==="all"||t.b===book}
function txIn(r,book=state.book){return liveTx().filter(t=>t.d>=r.start&&t.d<=r.end&&inBook(t,book))}
function totals(list){let i=0,o=0;for(const t of list){ if(t.t==="in") i+=t.a; else o+=t.a }return {in:i,out:o,net:i-o}}
function byCat(list,type="out"){const m={};for(const t of list) if(t.t===type) m[t.c]=(m[t.c]||0)+t.a;return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function openingFor(book){const op=state.profile.opening||{};return ["personal","business"].reduce((s,b)=>s+((book==="all"||book===b)?(+op[b]||0):0),0)}
function balanceBefore(date,book=state.book){let s=openingFor(book);for(const t of liveTx()) if(t.d<date&&inBook(t,book)) s+= t.t==="in"?t.a:-t.a;return s}

function periodBar(withModes=true){
  const r=range(state.mode,state.anchor);
  return `<div class="period">
    ${withModes?`<div class="seg modes" role="group" aria-label="Periode">${MODES.map(([m,l])=>`<button data-mode="${m}" aria-pressed="${state.mode===m}">${l}</button>`).join("")}</div>`:""}
    <div class="pnav"><button class="icon-btn" data-shift="-1" aria-label="Periode sebelumnya"><i data-lucide="chevron-left"></i></button>
    <div class="label">${r.label}${r.sub?` <span class="pill" style="font-family:var(--body);vertical-align:middle">${r.sub}</span>`:""}</div>
    <button class="icon-btn" data-shift="1" aria-label="Periode berikutnya"><i data-lucide="chevron-right"></i></button></div>
    ${(today()<r.start||today()>r.end)?`<button class="btn sm ghost today" data-act="today">Kembali ke ${({day:"hari",week:"minggu",month:"bulan",year:"tahun"})[state.mode]} ini</button>`:""}
  </div>`;

  return `<div class="tx" data-edit="${t.id}" role="button" tabindex="0">

function buckets(r){
  const B=[];
  if(state.mode==="year"){const y=+r.start.slice(0,4);for(let m=0;m<12;m++)B.push({label:BLN3[m],start:`${y}-${pad(m+1)}-01`,end:ymd(new Date(y,m+1,0))})}
  else if(state.mode==="month"){const k=r.start.slice(0,7);for(let d=1;d<=r.days;d++){const key=k+"-"+pad(d);B.push({label:String(d),start:key,end:key})}}
  else if(state.mode==="week"){for(let i=0;i<7;i++){const key=shift("day",r.start,i);const dd=parseYmd(key);B.push({label:HARI[dd.getDay()].slice(0,3)+" "+dd.getDate(),start:key,end:key})}}
  else{for(let i=6;i>=0;i--){const key=shift("day",r.start,-i);const dd=parseYmd(key);B.push({label:HARI[dd.getDay()].slice(0,3)+" "+dd.getDate(),start:key,end:key})}}
  return B;
}
function flowSeries(r,book=state.book){
  const B=buckets(r), list=liveTx().filter(t=>inBook(t,book));
  let bal=balanceBefore(B[0].start,book); const labels=[],inn=[],out=[],bals=[];
  for(const b of B){const s=totals(list.filter(t=>t.d>=b.start&&t.d<=b.end));labels.push(b.label);inn.push(s.in);out.push(s.out);bal+=s.net;bals.push(b.start>today()?null:bal)}
  return {labels,inn,out,bals};
}

/* ---------------- Analisa (aturan, berjalan di perangkat) ---------------- */
function profitLoss(list){
  let rev=0,hpp=0,opex=0,other=0;const ox={};
  for(const t of list){const c=CAT[t.c];if(!c)continue;
    if(t.t==="in"){ if(c.pl==="rev") rev+=t.a; else other+=t.a }
    else if(c.pl==="hpp") hpp+=t.a; else if(c.pl==="opex"){opex+=t.a;ox[t.c]=(ox[t.c]||0)+t.a} }
  return {rev,hpp,gross:rev-hpp,opex,net:rev-hpp-opex,ox:Object.entries(ox).sort((a,b)=>b[1]-a[1]),other};
}
function analyze(r,book=state.book){
  const list=txIn(r,book), t=totals(list);
  const prevR=range(state.mode,shift(state.mode,r.start,-1)); const pt=totals(txIn(prevR,book));
  const out=[];
  const plabel={day:"kemarin",week:"minggu lalu",month:prevR.label,year:prevR.label}[state.mode];
  if(!list.length){out.push({k:"info",i:"lightbulb",h:"Belum ada transaksi di periode ini.",s:"Catat transaksi pertama atau scan nota untuk mulai melihat analisa."});return out}
  if(t.net>=0) out.push({k:"good",i:"trending-up",h:`Arus kas positif <b>${rp(t.net)}</b>.`,s:t.in?`Anda menyisihkan ${pct(t.net,t.in).toFixed(0)}% dari pemasukan.`:""});
  else out.push({k:"bad",i:"alert-triangle",h:`Pengeluaran melebihi pemasukan <b>${rp(-t.net)}</b>.`,s:"Periksa kategori terbesar dan tunda belanja yang bisa ditunda."});
  if(pt.out>0){const ch=pct(t.out-pt.out,pt.out);if(Math.abs(ch)>=5) out.push({k:ch>0?"warn":"good",i:ch>0?"arrow-up-right":"arrow-down-left",h:`Pengeluaran ${ch>0?"naik":"turun"} <b>${Math.abs(ch).toFixed(0)}%</b> dibanding ${plabel}.`,s:`${rp(pt.out)} → ${rp(t.out)}`})}
  const cats=byCat(list), pcats=Object.fromEntries(byCat(txIn(prevR,book)));
  if(cats.length){const [id,v]=cats[0];out.push({k:"info",i:CAT[id]?.i||"circle",h:`Pos terbesar: <b>${esc(CAT[id]?.n)}</b> (${pct(v,t.out).toFixed(0)}% pengeluaran).`,s:rp(v)})}
  let jump=null;for(const [id,v] of cats){const p=pcats[id]||0;if(p>0&&v>p*1.3&&v-p>=50000&&(!jump||v-p>jump.d)) jump={id,d:v-p,p,v}}
  if(jump) out.push({k:"warn",i:"alert-triangle",h:`<b>${esc(CAT[jump.id].n)}</b> melonjak ${pct(jump.v-jump.p,jump.p).toFixed(0)}% dari periode lalu.`,s:`${rp(jump.p)} → ${rp(jump.v)}`});
  const el=elapsedDays(r);
  if((state.mode==="month"||state.mode==="week")&&el>0&&el<r.days){const avg=t.out/el;const proj=avg*r.days;out.push({k:"info",i:"calendar-days",h:`Rata-rata belanja <b>${rp(avg)}</b>/hari. Proyeksi akhir ${state.mode==="week"?"minggu":"bulan"} <b>${rp(proj)}</b>.`,s:t.in?`Proyeksi sisa: ${rp(t.in-proj)}`:"Belum ada pemasukan tercatat di periode ini."})}
  if(state.mode==="month"){const b=state.profile.budgets||{};for(const [id,v] of cats){const lim=b[id];if(lim){const p=pct(v,lim);if(p>=100) out.push({k:"bad",i:"target",h:`Anggaran <b>${esc(CAT[id].n)}</b> terlewati ${(p-100).toFixed(0)}%.`,s:`${rp(v)} dari ${rp(lim)}`});else if(p>=80) out.push({k:"warn",i:"target",h:`Anggaran <b>${esc(CAT[id].n)}</b> sudah terpakai ${p.toFixed(0)}%.`,s:`Sisa ${rp(lim-v)}`})}}}
  if(book!=="business" && state.mode!=="day"){
    const per=list.filter(x=>x.b==="personal");const inc=totals(per).in;
    if(inc>0){let needs=0,wants=0;per.filter(x=>x.t==="out").forEach(x=>{(CAT[x.c]?.g==="needs")?needs+=x.a:wants+=x.a});const sv=inc-needs-wants;
      out.push({k:(pct(wants,inc)>30||pct(sv,inc)<20)?"warn":"good",i:"piggy-bank",h:`Pola 50/30/20: kebutuhan <b>${pct(needs,inc).toFixed(0)}%</b>, keinginan <b>${pct(wants,inc).toFixed(0)}%</b>, tabungan <b>${pct(sv,inc).toFixed(0)}%</b>.`,s:"Patokan sehat: kebutuhan ≤ 50%, keinginan ≤ 30%, tabungan ≥ 20%."})}
  }
  if(book!=="personal"){const pl=profitLoss(list.filter(x=>x.b==="business"));if(pl.rev>0){out.push({k:pl.net>=0?"good":"bad",i:"store",h:`Margin laba bersih usaha <b>${pct(pl.net,pl.rev).toFixed(1)}%</b>, HPP ${pct(pl.hpp,pl.rev).toFixed(0)}% dari omzet.`,s:`Laba kotor ${rp(pl.gross)} · Laba bersih ${rp(pl.net)}`});if(pct(pl.hpp,pl.rev)>65)out.push({k:"warn",i:"package",h:"HPP di atas 65% omzet.",s:"Tinjau harga jual atau negosiasi ulang dengan pemasok."})}}
  const hist=liveTx().filter(x=>x.t==="out"&&inBook(x,book));
  const med=id=>{const a=hist.filter(x=>x.c===id).map(x=>x.a).sort((p,q)=>p-q);return a.length>=4?a[Math.floor(a.length/2)]:0};
  const odd=list.filter(x=>x.t==="out"&&x.a>=100000&&med(x.c)&&x.a>med(x.c)*3).sort((a,b)=>b.a-a.a)[0];
  if(odd) out.push({k:"warn",i:"alert-triangle",h:`Transaksi tidak biasa: <b>${esc(odd.m||odd.n||CAT[odd.c].n)}</b> ${rp(odd.a)}.`,s:`Sekitar ${(odd.a/med(odd.c)).toFixed(1)}× nilai biasanya untuk ${esc(CAT[odd.c].n)}.`});
  const months={};hist.forEach(x=>{const k=(x.m||"").toLowerCase().trim();if(!k)return;(months[k]=months[k]||new Set()).add(x.d.slice(0,7))});
  const rec=Object.entries(months).filter(([,s])=>s.size>=3).map(([k])=>k).slice(0,4);
  if(rec.length) out.push({k:"info",i:"receipt",h:`Pengeluaran rutin terdeteksi: <b>${rec.map(esc).join(", ")}</b>.`,s:"Pastikan setiap langganan memang masih Anda pakai."});
  return out;
}

function cashRows(r){
  // baris rincian sesuai periode: harian → per transaksi, mingguan → per hari, bulanan → per minggu, tahunan → per bulan
  const list=txIn(r); let bal=balanceBefore(r.start); const rows=[];
  if(state.mode==="day"){
    list.sort((a,b)=>(a.ts||0)-(b.ts||0)).forEach(t=>{const open=bal;bal+=t.t==="in"?t.a:-t.a;rows.push({label:t.m||t.n||CAT[t.c]?.n,sub:CAT[t.c]?.n,in:t.t==="in"?t.a:0,out:t.t==="out"?t.a:0,open,close:bal,id:t.id})});
    return rows;
  }
  const parts=[];
  if(state.mode==="week"){for(let i=0;i<7;i++){const k=shift("day",r.start,i);const dd=parseYmd(k);parts.push({label:`${HARI[dd.getDay()]}, ${dd.getDate()} ${BLN3[dd.getMonth()]}`,start:k,end:k})}}
  else if(state.mode==="month"){let d=parseYmd(r.start),i=1;while(ymd(d)<=r.end){const s=ymd(d);const e=new Date(d);e.setDate(d.getDate()+(6-((d.getDay()+6)%7)));let es=ymd(e);if(es>r.end)es=r.end;const ed=parseYmd(es);
    parts.push({label:`Minggu ${i}`,sub:`${d.getDate()}–${ed.getDate()} ${BLN3[d.getMonth()]}`,start:s,end:es});d=new Date(ed);d.setDate(ed.getDate()+1);i++}}
  else{const y=+r.start.slice(0,4);for(let m=0;m<12;m++)parts.push({label:BLN[m],start:`${y}-${pad(m+1)}-01`,end:ymd(new Date(y,m+1,0))})}
  for(const p of parts){const L=list.filter(t=>t.d>=p.start&&t.d<=p.end);const s=totals(L);const open=bal;bal+=s.net;rows.push({...p,in:s.in,out:s.out,open,close:bal,n:L.length,future:p.start>today()})}
  return rows;
}
function statementHTML(r,list){
  const open=balanceBefore(r.start), t=totals(list), close=open+t.net;
  const ins=byCat(list,"in"), outs=byCat(list,"out");
  const line=(l,v,cls="")=>`<div class="ln ${cls}"><span>${l}</span><span class="num">${v}</span></div>`;
  let h=`<div class="pl">${line("Saldo awal periode",rp(open),"tot")}
    <div class="ln head"><span>Arus kas masuk</span><span></span></div>
    ${ins.map(([id,v])=>line(esc(CAT[id]?.n),rp(v),"sub")).join("")||line("Tidak ada pemasukan","—","sub")}
    ${line("Total kas masuk",`<span class="in">${rp(t.in)}</span>`,"tot")}
    <div class="ln head"><span>Arus kas keluar</span><span></span></div>
    ${outs.map(([id,v])=>line(esc(CAT[id]?.n),"("+rp(v)+")","sub")).join("")||line("Tidak ada pengeluaran","—","sub")}
    ${line("Total kas keluar",`<span class="out">(${rp(t.out)})</span>`,"tot")}
    ${line("Arus kas bersih",`<span class="${t.net<0?"out":"in"}">${rp(t.net)}</span>`,"tot")}
    ${line("Saldo akhir periode",rp(close),"grand")}</div>`;
  return {html:h,open,close,t};
}
function activityHTML(list){
  const biz=list.filter(x=>x.b==="business"); if(!biz.length) return "";
  const g={ops:{in:0,out:0},inv:{in:0,out:0},fin:{in:0,out:0}};
  biz.forEach(t=>{const a=CAT[t.c]?.act||"ops";g[a][t.t==="in"?"in":"out"]+=t.a});
  const row=(l,o)=>`<div class="ln sub"><span>${l} masuk</span><span class="num">${rp(o.in)}</span></div><div class="ln sub"><span>${l} keluar</span><span class="num">(${rp(o.out)})</span></div>`;
  const net=o=>o.in-o.out; const all=net(g.ops)+net(g.inv)+net(g.fin);
  return `<div class="card"><h3><i data-lucide="store"></i>Arus kas usaha per aktivitas</h3><div class="pl">
    <div class="ln head"><span>Aktivitas operasi</span><span></span></div>${row("Kas operasi",g.ops)}<div class="ln tot"><span>Kas bersih operasi</span><span class="num ${net(g.ops)<0?"out":""}">${rp(net(g.ops))}</span></div>
    <div class="ln head"><span>Aktivitas investasi</span><span></span></div><div class="ln sub"><span>Pembelian peralatan & aset</span><span class="num">(${rp(g.inv.out)})</span></div><div class="ln tot"><span>Kas bersih investasi</span><span class="num ${net(g.inv)<0?"out":""}">${rp(net(g.inv))}</span></div>
    <div class="ln head"><span>Aktivitas pendanaan</span><span></span></div><div class="ln sub"><span>Tambahan modal</span><span class="num">${rp(g.fin.in)}</span></div><div class="ln sub"><span>Prive pemilik</span><span class="num">(${rp(g.fin.out)})</span></div><div class="ln tot"><span>Kas bersih pendanaan</span><span class="num ${net(g.fin)<0?"out":""}">${rp(net(g.fin))}</span></div>
    <div class="ln grand"><span>Kenaikan (penurunan) kas</span><span class="num ${all<0?"out":"in"}">${rp(all)}</span></div></div></div>`;
}
function viewReport(){
  const r=range(state.mode,state.anchor),list=txIn(r),t=totals(list);
  const prev=range(state.mode,shift(state.mode,r.start,-1));const pmap=Object.fromEntries(byCat(txIn(prev)));
  const cats=byCat(list);
  const st=statementHTML(r,list);
  const rows=cashRows(r);
  const modeName={day:"Harian",week:"Mingguan",month:"Bulanan",year:"Tahunan"}[state.mode];
  const showPL=state.book!=="personal"&&list.some(x=>x.b==="business");
  const pl=profitLoss(list.filter(x=>x.b==="business"));
  const el=elapsedDays(r);
  const bookName=state.book==="business"?"usaha":state.book==="personal"?"pribadi":"gabungan pribadi dan usaha";
  const head=state.mode==="day"?["Keterangan","Masuk","Keluar","Saldo"]:["Periode","Saldo awal","Masuk","Keluar","Bersih","Saldo akhir"];
  const body=state.mode==="day"
    ? rows.map(x=>`<tr data-edit="${x.id}" style="cursor:pointer"><td>${esc(x.label)}<div class="kbd">${esc(x.sub||"")}</div></td><td class="r num in">${x.in?rp(x.in):"—"}</td><td class="r num out">${x.out?rp(x.out):"—"}</td><td class="r num">${rp(x.close)}</td></tr>`).join("")
    : rows.map(x=>`<tr class="${x.future||(!x.n&&state.mode!=="week")?"quiet":""}"><td>${esc(x.label)}${x.sub?`<div class="kbd">${esc(x.sub)}</div>`:""}</td><td class="r num">${x.future?"—":rp(x.open)}</td><td class="r num in">${x.in?rp(x.in):"—"}</td><td class="r num out">${x.out?rp(x.out):"—"}</td><td class="r num ${x.in-x.out<0?"out":""}">${x.future?"—":rp(x.in-x.out)}</td><td class="r num">${x.future?"—":rp(x.close)}</td></tr>`).join("");
  const foot=state.mode==="day"?`<tr class="total"><td>Total</td><td class="r num in">${rp(t.in)}</td><td class="r num out">${rp(t.out)}</td><td class="r num">${rp(st.close)}</td></tr>`
    :`<tr class="total"><td>Total</td><td class="r num">${rp(st.open)}</td><td class="r num in">${rp(t.in)}</td><td class="r num out">${rp(t.out)}</td><td class="r num">${rp(t.net)}</td><td class="r num">${rp(st.close)}</td></tr>`;
  return `<div class="row no-print report-head"><div style="min-width:0"><h2 class="section-title">Laporan Arus Kas ${modeName}</h2><p class="lede">Buku ${bookName} · ${esc(r.label)}${r.sub?" ("+r.sub+")":""}.</p></div><span class="spacer"></span>
    <div class="toolbar"><button class="btn sm" data-act="export-cash"><i data-lucide="download"></i>CSV laporan</button><button class="btn sm" data-act="export-csv"><i data-lucide="download"></i>CSV transaksi</button><button class="btn sm" data-act="print"><i data-lucide="file-text"></i>Cetak / PDF</button></div></div>
  ${periodBar()}
  <div class="stat-row">
    <div class="stat"><div class="t">Saldo awal</div><div class="v num">${rp(st.open)}</div></div>
    <div class="stat"><div class="t">Kas masuk</div><div class="v num in">${rp(t.in)}</div></div>
    <div class="stat"><div class="t">Kas keluar</div><div class="v num out">${rp(t.out)}</div></div>
    <div class="stat"><div class="t">Saldo akhir</div><div class="v num ${st.close<0?"out":""}">${rp(st.close)}</div><div class="h ${t.net<0?"out":"in"}">${t.net>=0?"+":""}${rp(t.net)} periode ini</div></div>
  </div>
  <div class="grid g-main">
    <div class="card"><h3><i data-lucide="bar-chart-3"></i>${state.mode==="year"?"Arus kas per bulan":state.mode==="day"?"7 hari terakhir":"Arus kas per hari"}<span class="right legend"><span><i style="background:var(--in)"></i>Masuk</span><span><i style="background:var(--out)"></i>Keluar</span><span><i style="background:var(--moon)"></i>Saldo</span></span></h3><div class="chart-box"><canvas id="cRep"></canvas></div></div>
    <div class="card"><h3><i data-lucide="file-text"></i>Laporan arus kas</h3>${st.html}</div>
  </div>
  <div class="card"><h3><i data-lucide="calendar-days"></i>Rincian ${state.mode==="day"?"transaksi":state.mode==="week"?"per hari":state.mode==="month"?"per minggu":"per bulan"}${state.mode!=="day"&&el?`<span class="right dim">rata-rata keluar ${rp(t.out/Math.max(1,el))}/hari</span>`:""}</h3>
    <div class="tbl-wrap"><table class="tbl"><thead><tr>${head.map((h,i)=>`<th class="${i?"r":""}">${h}</th>`).join("")}</tr></thead><tbody>${body||`<tr><td colspan="${head.length}" class="dim">Tidak ada transaksi di periode ini</td></tr>`}${rows.length?foot:""}</tbody></table></div></div>
  ${state.book!=="personal"?activityHTML(list):""}
  ${showPL?`<div class="card"><h3><i data-lucide="store"></i>Laba Rugi Usaha<span class="right dim">metode kas</span></h3><div class="pl">
    <div class="ln tot"><span>Pendapatan usaha</span><span class="num">${rp(pl.rev)}</span></div>
    <div class="ln"><span>Harga pokok penjualan (HPP)</span><span class="num out">(${rp(pl.hpp)})</span></div>
    <div class="ln tot"><span>Laba kotor <span class="dim">· ${pct(pl.gross,pl.rev).toFixed(1)}%</span></span><span class="num">${rp(pl.gross)}</span></div>
    ${pl.ox.map(([id,v])=>`<div class="ln sub"><span>${esc(CAT[id].n)}</span><span class="num">(${rp(v)})</span></div>`).join("")}
    <div class="ln"><span>Total biaya operasional</span><span class="num out">(${rp(pl.opex)})</span></div>
    <div class="ln grand"><span>Laba bersih</span><span class="num ${pl.net<0?"out":"in"}">${rp(pl.net)}</span></div>
    <div class="helptext">Tambahan modal dan prive tidak dihitung sebagai pendapatan atau biaya.</div></div></div>`:""}

    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Kategori</th><th class="r">Nominal</th><th class="r">Porsi</th><th class="r">Periode lalu</th><th class="r">Perubahan</th></tr></thead><tbody>
    ${cats.map(([id,v])=>{const p=pmap[id]||0;const ch=p?pct(v-p,p):null;return `<tr><td>${esc(CAT[id]?.n)}</td><td class="r num">${rp(v)}</td><td class="r num">${pct(v,t.out).toFixed(0)}%</td><td class="r num dim">${p?rp(p):"—"}</td><td class="r num ${ch>0?"out":ch<0?"in":""}">${ch===null?"baru":(ch>0?"+":"")+ch.toFixed(0)+"%"}</td></tr>`}).join("")||`<tr><td colspan="5" class="dim">Tidak ada data</td></tr>`}
    </tbody></table></div></div>`;
}

  const labels=[],a=[],b=[],c=[];

  chart("cTrend",{data:{labels,datasets:[
    {type:"bar",label:"Pemasukan",data:a,backgroundColor:"rgba(92,211,166,.8)",borderRadius:5,maxBarThickness:20},

    options:{responsive:true,maintainAspectRatio:false,scales:{x:{grid:{display:false}},y:{ticks:{callback:v=>rpS(v).replace("Rp ","")}}}}});
}

function dialog(title,inner,onSubmit,submitLabel="Simpan",danger=false){
  const root=$("#modalRoot");
  root.innerHTML=`<div class="overlay" id="ov"><form class="sheet" id="dlg" autocomplete="off"><div class="sheet-h"><h2>${title}</h2><button type="button" class="icon-btn" data-close aria-label="Tutup"><i data-lucide="x"></i></button></div>
    <div class="form">${inner}<div class="err" id="dErr"></div><div class="row"><span class="spacer"></span><button type="button" class="btn ghost" data-close>Batal</button><button class="btn ${danger?"danger":"primary"}" id="dGo">${submitLabel}</button></div></div></form></div>`;
  icons();
  $("#ov").addEventListener("click",e=>{if(e.target.id==="ov"||e.target.closest("[data-close]"))closeModal();const pk=e.target.closest("[data-peek]");if(pk){const i=$("#"+pk.dataset.peek);i.type=i.type==="password"?"text":"password"}});
  $("#dlg").addEventListener("submit",async e=>{e.preventDefault();const b=$("#dGo");b.disabled=true;$("#dErr").textContent="";try{await onSubmit()}catch(err){$("#dErr").textContent=err.message||"Gagal"}finally{b.disabled=false}});
  setTimeout(()=>$("#dlg input")?.focus(),60);
}

/* ---------------- Catat cepat ---------------- */
function parseQuick(s){
  let text=" "+s.trim()+" ";let amt=NaN;
  const m=text.match(/(\d+(?:[.,]\d+)?)\s*(rb|ribu|k|jt|juta)\b/i);
  if(m){const v=parseFloat(m[1].replace(",","."));const mult=/jt|juta/i.test(m[2])?1e6:1e3;amt=Math.round(v*mult);text=text.replace(m[0]," ")}
  else{const m2=text.match(/\d{1,3}(?:[.,]\d{3})+|\d{4,}/);if(m2){amt=parseNum(m2[0]);text=text.replace(m2[0]," ")}}
  let d=today();if(/\bkemarin\b/i.test(text)){d=shift("day",today(),-1);text=text.replace(/\bkemarin\b/i," ")}
  const isIn=/\b(gaji|terima|diterima|masuk|dapat|jual|penjualan|bonus|thr|omzet|pendapatan|dividen|cashback|refund|pesanan|order)\b/i.test(text);
  const book=state.book==="all"?"personal":state.book;const type=isIn?"in":"out";
  const desc=text.replace(/\s+/g," ").trim();
  const cl=classify(desc,book,type);
  return {a:amt,d,t:type,b:book,n:desc,c:cl?.id||defaultCat(book,type),src:cl?.src};
}
function bindQuick(){
  const f=$("#quickForm");if(!f)return;const inp=$("#quickIn"),hint=$("#quickHint");
  inp.addEventListener("input",()=>{const v=inp.value.trim();if(!v){hint.textContent="Nominal bisa ditulis 35rb, 1,5jt, atau 35000. Kategori dipilih otomatis.";return}
    const q=parseQuick(v);hint.innerHTML=isNaN(q.a)?"Tulis nominalnya, misalnya <b>35rb</b>.":`${q.t==="in"?"Pemasukan":"Pengeluaran"} <b class="num">${rp(q.a)}</b> · ${esc(CAT[q.c].n)}${q.src?` <span class="pill">${q.src}</span>`:""}${q.d!==today()?" · kemarin":""}`});
  f.addEventListener("submit",e=>{e.preventDefault();const q=parseQuick(inp.value);if(isNaN(q.a)||!q.a){toast("Nominal belum terbaca");return}
    addTx({...q,m:"",p:""});inp.value="";toast(`${q.t==="in"?"Pemasukan":"Pengeluaran"} ${rp(q.a)} dicatat · ${CAT[q.c].n}`);render()});

const Scan={
  worker:null,cancelled:false,queue:[],total:0,src:"camera",
  abort(){this.cancelled=true},
  start(files,src){this.queue=[...files];this.total=files.length;this.src=src;this.next()},
  next(){const f=this.queue.shift();if(!f){if(this.total>1)toast(`Selesai memproses ${this.total} gambar`);this.total=0;return}this.run(f)},
  label(){return this.total>1?`${this.total-this.queue.length} dari ${this.total}`:""},
  async lib(){if(window.Tesseract)return;await new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";s.onload=res;s.onerror=()=>rej(new Error("Tidak bisa memuat mesin pembaca. Periksa koneksi internet."));document.head.appendChild(s)})},
  async prep(file){
    const bmp=await createImageBitmap(file);const s=Math.min(1.6,1800/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);const x=c.getContext("2d");x.drawImage(bmp,0,0,c.width,c.height);
    const im=x.getImageData(0,0,c.width,c.height),d=im.data;
    // screenshot gelap (mode malam aplikasi bank) dibalik agar teks gelap di atas terang
    let sum=0;for(let i=0;i<d.length;i+=40)sum+=.299*d[i]+.587*d[i+1]+.114*d[i+2];const inv=sum/(d.length/40)<110;
    for(let i=0;i<d.length;i+=4){let g=.299*d[i]+.587*d[i+1]+.114*d[i+2];if(inv)g=255-g;g=(g-128)*1.45+140;g=g<0?0:g>255?255:g;d[i]=d[i+1]=d[i+2]=g}
    x.putImageData(im,0,0);return c;
  },
  async run(file){
    this.cancelled=false;
    const url=URL.createObjectURL(file);const q=this.label();
    const root=$("#modalRoot"); root.onclick=null;
    root.innerHTML=`<div class="overlay" id="ov"><div class="sheet"><div class="sheet-h"><h2>Membaca gambar</h2>${q?`<span class="queue-pill">${q}</span>`:""}<button class="icon-btn" data-close aria-label="Tutup"><i data-lucide="x"></i></button></div>
      <div class="scan-stage"><img class="scan-img" src="${url}" alt="Nota atau bukti pembayaran"><div class="progress"><i id="scanBar"></i></div><div class="helptext" id="scanMsg">Menyiapkan mesin pembaca… (pertama kali butuh ±10 detik dan koneksi internet)</div>
      <div class="row"><span class="spacer"></span><button class="btn ghost" data-skip>Isi manual saja</button></div></div></div></div>`;icons();
    const blobP=compressImage(file);
    const srcLabel=this.src==="camera"?"Foto nota terlampir":"Gambar dari galeri terlampir";
    $("#ov").addEventListener("click",async e=>{if(e.target.closest("[data-close]")||e.target.id==="ov"){closeModal();return}
      if(e.target.closest("[data-skip]")){this.cancelled=true;const blob=await blobP;openForm({},{blob,title:"Isi dari gambar",note:"Lengkapi data dari gambar terlampir.",queue:q,srcLabel})}});
    try{
      await this.lib(); if(this.cancelled) return;
      const msg=$("#scanMsg"),bar=$("#scanBar");

      openForm({t:type,a:res.total||0,d:res.date||today(),b:book,c:cl?.id||"",m:res.merchant,n:res.items.length?res.items.slice(0,3).map(i=>i.name).join(", ").slice(0,60):(res.kind==="payment"?(type==="in"?"Dana masuk":"Pembayaran"):""),p:res.method||"",items:res.items.length?res.items:null,src:cl?.src},
        {blob,queue:q,srcLabel,extraText:res.raw.slice(0,400),title:res.kind==="payment"?"Hasil bukti pembayaran":"Hasil scan nota",
         note:res.total?`Terbaca dari ${kindLabel}: <b>${esc(res.merchant||(type==="in"?"pengirim":"penerima"))}</b>, ${type==="in"?"pemasukan":"total"} <b>${rp(res.total)}</b>${res.date?", "+fmtDateLong(res.date):""}. Periksa sebelum menyimpan.`:"Nominal belum terbaca jelas. Isi secara manual; gambar tetap terlampir sebagai bukti."});
    }catch(err){console.error(err);if(this.cancelled)return;const blob=await blobP;openForm({},{blob,queue:q,srcLabel,title:"Isi dari gambar",note:esc(err.message||"Gagal membaca gambar")+" — lengkapi data secara manual."})}
  }
};
function parseReceipt(raw){
  const lines=raw.split(/\n/).map(l=>l.replace(/[|]/g," ").replace(/\s+/g," ").trim()).filter(Boolean);
  const low=raw.toLowerCase();
  const out={merchant:"",total:0,date:"",items:[],method:"",kind:"receipt",type:"out",raw:low};
  if(/(transfer berhasil|transaksi berhasil|pembayaran berhasil|payment success|pembayaran sukses|transaksi sukses|berhasil dibayar|bukti transfer|bukti pembayaran|detail transaksi|transfer sukses|top ?up berhasil|bi-?fast|qris|dana masuk|uang masuk)/i.test(raw)) out.kind="payment";
  if(/(dana masuk|uang masuk|diterima dari|terima uang|menerima dana|kamu menerima|anda menerima|received from|transfer masuk|kredit masuk)/i.test(raw)) out.type="in";
  // nominal
  const amtIn=(l,loose)=>{const re=loose?/\d{1,3}(?:[.,]\d{3})+(?:[.,]\d{2})?|\b\d{4,8}\b/g:/\d{1,3}(?:[.,]\d{3})+(?:[.,]\d{2})?/g;const ms=l.match(re);return ms?ms.map(parseNum).filter(n=>n>=100&&n<1e10):[]};
  const pri=[/grand\s*total/i,/total\s*(bayar|belanja|pembayaran|tagihan|transfer|transaksi)/i,/(nominal|jumlah)\s*(transfer|pembayaran|bayar|transaksi)?/i,/total\s*harga/i,/\btotal\b/i,/\b(amount|netto|tagihan|harus dibayar)\b/i];
  const skip=/(sub\s*total|subtotal|total\s*item|total\s*qty|disc|diskon|hemat|kembali|kembalian|change|tunai|cash\b|ppn|pajak|tax|service|saldo|balance|biaya admin|poin|point|no\.?\s*ref|referensi|rekening|id transaksi)/i;
  for(const re of pri){for(const l of lines){if(re.test(l)&&!skip.test(l)){const v=amtIn(l,/rp/i.test(l));if(v.length){out.total=v[v.length-1];break}}}if(out.total)break}
  if(!out.total){const rpl=lines.filter(l=>/rp/i.test(l)&&!skip.test(l)).flatMap(l=>amtIn(l,true));if(rpl.length)out.total=Math.max(...rpl)}
  if(!out.total){const sub=lines.find(l=>/sub\s*total|subtotal/i.test(l));if(sub){const v=amtIn(sub,true);if(v.length)out.total=v[v.length-1]}}
  if(!out.total){const all=lines.filter(l=>!skip.test(l)&&!/(telp|npwp)/i.test(l)).flatMap(l=>amtIn(l,false));if(all.length)out.total=Math.max(...all)}
  // toko / penerima
  if(out.kind==="payment"){
    const keyRe=out.type==="in"?/^(dari|pengirim|nama pengirim|from|sumber dana)\b\s*:?\s*(.*)$/i:/^(ke|kepada|penerima|nama penerima|tujuan|merchant|nama merchant|dibayar ke|bayar ke|to|nama toko)\b\s*:?\s*(.*)$/i;
    for(let i=0;i<lines.length;i++){const m=lines[i].match(keyRe);if(m){let v=m[2]&&/[a-z]{3,}/i.test(m[2])?m[2]:(lines[i+1]||"");v=v.replace(/[^A-Za-z0-9&.\-' ]/g," ").replace(/\b\d{6,}\b/g,"").replace(/\s+/g," ").trim();if(/[a-z]{3,}/i.test(v)){out.merchant=v.slice(0,40);break}}}
  }
  if(!out.merchant){for(const l of lines.slice(0,6)){if(/[a-z]{3,}/i.test(l)&&!/(jl\.?|jalan|telp|tlp|npwp|no\.|kec\.|kel\.|www|http|struk|receipt|berhasil|sukses|transaksi|detail|bukti)/i.test(l)&&(l.replace(/[^a-z]/ig,"").length/l.length)>.5){out.merchant=l.replace(/[^A-Za-z0-9&.\- ']/g,"").trim().slice(0,40);break}}}
  const known=["indomaret","alfamart","alfamidi","superindo","hypermart","transmart","carrefour","lotte","pertamina","shell","starbucks","kfc","mcdonald","guardian","watsons","kimia farma","gramedia","ace","informa","matahari","hokben","solaria","janji jiwa","kopi kenangan","pln","telkomsel","pdam","indihome","tokopedia","shopee"];
  const k=known.find(w=>new RegExp("\\b"+w+"\\b").test(low));if(k&&(out.kind==="receipt"||!out.merchant))out.merchant=k.replace(/\b\w/g,m=>m.toUpperCase());
  // tanggal
  const mDate=raw.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  const mon={jan:1,feb:2,mar:3,apr:4,mei:5,may:5,jun:6,jul:7,agu:8,ags:8,aug:8,sep:9,okt:10,oct:10,nov:11,des:12,dec:12};
  const mDate2=low.match(/(\d{1,2})\s*[-\s]?(jan|feb|mar|apr|mei|may|jun|jul|agu|ags|aug|sep|okt|oct|nov|des|dec)[a-z]*\s*[-\s,]?\s*(\d{2,4})/);
  let dd,mm,yy;if(mDate2){dd=+mDate2[1];mm=mon[mDate2[2]];yy=+mDate2[3]}else if(mDate){dd=+mDate[1];mm=+mDate[2];yy=+mDate[3];if(mm>12&&dd<=12)[dd,mm]=[mm,dd]}
  if(dd&&mm){if(yy<100)yy+=2000;const d=new Date(yy,mm-1,dd);if(!isNaN(d)&&yy>2000&&d<=new Date(Date.now()+864e5)&&(Date.now()-d)<3*365*864e5)out.date=ymd(d)}
  // metode
  if(/qris/i.test(raw))out.method="QRIS";else if(/(gopay|ovo|shopeepay|linkaja|\bdana\b(?!\s*masuk))/i.test(raw))out.method="E-Wallet";else if(/(transfer|bi-?fast|m-?banking|livin|brimo|mybca|bca mobile|bni mobile|jenius|virtual account|\bva\b)/i.test(raw))out.method="Transfer Bank";else if(/(debit|debet|edc)/i.test(raw))out.method="Kartu Debit";else if(/(kredit|credit|visa|master)/i.test(raw))out.method="Kartu Kredit";else if(/(tunai|cash)/i.test(raw))out.method="Tunai";
  // item (hanya untuk struk)
  if(out.kind==="receipt")for(const l of lines){if(skip.test(l)||/total|telp|npwp|kasir|tanggal|struk|terima kasih|member/i.test(l))continue;
    const m=l.match(/^(.*?[A-Za-z]{3,}.*?)\s+(?:\d+\s*[xX@]\s*[\d.,]+\s+)?(\d{1,3}(?:[.,]\d{3})+|\d{4,})$/);
    if(m){const name=m[1].replace(/\s+\d+\s*$/,"").replace(/[^A-Za-z0-9 .&\-\/]/g,"").trim();const price=parseNum(m[2]);if(name.length>=3&&price>=100&&(!out.total||price<=out.total))out.items.push({name:name.slice(0,40),price})}
    if(out.items.length>=30)break}
  return out;
}

/* ---------------- Ekspor / impor ---------------- */
function download(name,data,type){const blob=new Blob([data],{type});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const csvEsc=v=>{if(typeof v==="number")return String(v);v=String(v??"");if(/^[=+\-@]/.test(v))v="'"+v;return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function toCSV(list){const head="tanggal,jenis,nominal,kategori,buku,toko,catatan,metode";return head+"\n"+list.sort((a,b)=>a.d.localeCompare(b.d)).map(t=>[t.d,t.t==="in"?"masuk":"keluar",t.a,CAT[t.c]?.n||t.c,t.b==="business"?"usaha":"pribadi",t.m,t.n,t.p].map(csvEsc).join(",")).join("\n")}
function cashCSV(){
  const r=range(state.mode,state.anchor);const rows=cashRows(r);const t=totals(txIn(r));const open=balanceBefore(r.start);
  const L=[["Laporan Arus Kas Luna Money Tool"],["Periode",r.label+(r.sub?" ("+r.sub+")":"")],["Buku",{personal:"Pribadi",business:"Usaha",all:"Semua"}[state.book]],[],
    state.mode==="day"?["Keterangan","Kategori","Masuk","Keluar","Saldo"]:["Periode","Rentang","Saldo awal","Masuk","Keluar","Bersih","Saldo akhir"]];
  rows.forEach(x=>L.push(state.mode==="day"?[x.label,x.sub,x.in,x.out,x.close]:[x.label,x.sub||(x.start===x.end?x.start:x.start+" s/d "+x.end),x.open,x.in,x.out,x.in-x.out,x.close]));
  L.push([],["Saldo awal",open],["Total masuk",t.in],["Total keluar",t.out],["Arus kas bersih",t.net],["Saldo akhir",open+t.net]);
  return L.map(r=>r.map(csvEsc).join(",")).join("\n");
}
function parseCSV(text){const rows=[];let row=[],cur="",q=false;for(let i=0;i<text.length;i++){const ch=text[i];if(q){if(ch=='"'){if(text[i+1]=='"'){cur+='"';i++}else q=false}else cur+=ch}else if(ch=='"')q=true;else if(ch==","||ch==";"){row.push(cur);cur=""}else if(ch=="\n"){row.push(cur);rows.push(row);row=[];cur=""}else if(ch!="\r")cur+=ch}if(cur||row.length){row.push(cur);rows.push(row)}return rows}
async function importFile(file){
  const text=(await file.text()).replace(/^\ufeff/,"");let n=0;
  if(file.name.endsWith(".json")){const d=JSON.parse(text);for(const t of Object.values(d.tx||{})){if(!t||!t.id||!t.d)continue;const cur=state.tx[t.id];if(!cur||(t.u||0)>(cur.u||0)){t.r=null;state.tx[t.id]=t;n++}}
    if(d.profile){const p=d.profile;state.profile=Object.assign(state.profile,{budgets:p.budgets||state.profile.budgets,rules:p.rules||state.profile.rules,opening:p.opening||state.profile.opening,updatedAt:Date.now()})}
    save([...new Set(Object.values(state.tx).map(t=>t.d.slice(0,7)))]);}
  else{const rows=parseCSV(text).filter(r=>r.some(Boolean));const h=rows.shift().map(x=>x.trim().toLowerCase());const ix=k=>h.indexOf(k);const nameToId=Object.fromEntries(CATS.map(c=>[c.n.toLowerCase(),c.id]));
    const months=new Set();
    for(const r of rows){let d=(r[ix("tanggal")]||"").trim();const m=d.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);if(m)d=`${m[3]}-${pad(m[2])}-${pad(m[1])}`;if(!/^\d{4}-\d{2}-\d{2}$/.test(d))continue;
      const t=/masuk|in|pemasukan/i.test(r[ix("jenis")]||"")?"in":"out";const a=parseNum(r[ix("nominal")]);if(!a)continue;
      const b=/usaha|bisnis|business/i.test(r[ix("buku")]||"")?"business":"personal";const toko=(r[ix("toko")]||"").replace(/^'/,""),cat=(r[ix("kategori")]||"").toLowerCase().trim(),note=(r[ix("catatan")]||"").replace(/^'/,"");
      let c=nameToId[cat]||(CAT[cat]?cat:null);if(!c||CAT[c].b!==b||CAT[c].t!==t)c=classify(toko+" "+note,b,t)?.id||defaultCat(b,t);
      const id=uid();state.tx[id]={id,d,t,a,c,b,m:toko,n:note,p:r[ix("metode")]||"",ts:Date.now(),u:Date.now()};months.add(d.slice(0,7));n++}
    save([...months]);}
  render();toast(`${n} transaksi diimpor`);
}

/* ---------------- Data contoh ---------------- */
function loadDemo(){
  const now=new Date();const mk=(dOff,o)=>{const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-dOff);return {...o,d:ymd(d),demo:true}};
  const P=[["gaji","in","PT Sinar Abadi","Gaji bulanan",8500000,"Transfer Bank"],["rumah","out","PLN","Token listrik",250000,"E-Wallet"],["rumah","out","PDAM","Tagihan air",95000,"Transfer Bank"],["rumah","out","IndiHome","Internet rumah",345000,"Transfer Bank"],["belanja","out","Indomaret","Belanja bulanan",487500,"QRIS"],["belanja","out","Pasar Badung","Sayur dan lauk",120000,"Tunai"],["makan","out","Kopi Kenangan","Kopi pagi",28000,"QRIS"],["makan","out","Warung Nasi Bu Rus","Makan siang",35000,"Tunai"],["makan","out","GoFood","Makan malam",68000,"E-Wallet"],["transport","out","Pertamina","Pertalite",50000,"QRIS"],["transport","out","Gojek","GoRide ke kantor",22000,"E-Wallet"],["kesehatan","out","Kimia Farma","Vitamin",86000,"Kartu Debit"],["hiburan","out","Netflix","Langganan",54000,"Kartu Kredit"],["sosial","out","Masjid Al Ikhlas","Sedekah Jumat",50000,"Tunai"],["komunikasi","out","Telkomsel","Paket data",100000,"E-Wallet"],["rt","out","Alfamart","Sabun dan deterjen",76000,"QRIS"],["pribadi","out","Barbershop","Potong rambut",45000,"Tunai"]];
  const B=[["b_jual","in","Pelanggan","Penjualan harian",1250000,"QRIS"],["b_jual","in","Shopee","Pencairan marketplace",2400000,"Transfer Bank"],["b_hpp","out","Supplier Kopi","Bahan baku biji kopi",1350000,"Transfer Bank"],["b_hpp","out","Toko Kemasan","Cup dan packaging",320000,"Tunai"],["b_ops","out","Pemilik Ruko","Sewa kios",1500000,"Transfer Bank"],["b_gaji","out","Karyawan","Gaji barista",2200000,"Transfer Bank"],["b_mkt","out","Meta Ads","Iklan Instagram",250000,"Kartu Kredit"],["b_log","out","JNE","Ongkir",48000,"Tunai"],["b_util","out","PLN","Listrik kios",380000,"E-Wallet"]];
  for(let mo=0;mo<4;mo++){
    const base=mo*30;const jitter=()=>0.85+Math.random()*0.3;
    P.forEach(([c,t,m,n,a,p],i)=>{const reps=["makan","transport"].includes(c)?5:c==="belanja"?2:1;for(let k=0;k<reps;k++){const off=base+(c==="gaji"?(now.getDate()-1):((i*3+k*6)%28));if(mo===0&&off>now.getDate()-1&&c!=="gaji")continue;addTx(mk(Math.max(0,off),{c,t,m,n,a:Math.round(a*(t==="in"||["rumah","hiburan","komunikasi"].includes(c)?1:jitter())/500)*500,p,b:"personal"}))}});
    B.forEach(([c,t,m,n,a,p],i)=>{const reps=c==="b_jual"&&m==="Pelanggan"?8:1;for(let k=0;k<reps;k++){const off=base+((i*4+k*3)%27);if(mo===0&&off>now.getDate()-1)continue;addTx(mk(off,{c,t,m,n,a:Math.round(a*jitter()/1000)*1000,p,b:"business"}))}});
  }
  state.profile.opening=Object.assign({personal:3500000,business:5000000},state.profile.opening&&(state.profile.opening.personal||state.profile.opening.business)?state.profile.opening:{});
  state.profile.budgets=Object.assign({makan:900000,belanja:900000,transport:500000,hiburan:200000},state.profile.budgets);state.profile.updatedAt=Date.now();save();render();toast("Data contoh dimuat");
}

/* ---------------- Event global ---------------- */
document.addEventListener("click",async e=>{
  if(!Auth.key) return;
  if(e.target.closest("#gate,#modalRoot")&&!e.target.closest("[data-act='scan']")) { /* ditangani masing-masing */ }
  const v=e.target.closest("[data-view]");if(v){go(v.dataset.view);return}
  const bk=e.target.closest("#bookSeg [data-book]");if(bk){state.book=bk.dataset.book;state.filter.cat="all";render();return}
  const md=e.target.closest("[data-mode]");if(md){state.mode=md.dataset.mode;render();return}
  const sh=e.target.closest("[data-shift]");if(sh){state.anchor=shift(state.mode,state.anchor,+sh.dataset.shift);render();return}
  const ed=e.target.closest("[data-edit]");if(ed&&!e.target.closest("#modalRoot")){const t=state.tx[ed.dataset.edit];if(t)openForm(Object.assign({},t));return}
  const rule=e.target.closest("[data-rule]");if(rule){delete state.profile.rules[rule.dataset.rule];state.profile.updatedAt=Date.now();save();render();return}
  const a=e.target.closest("[data-act]");if(!a)return;
  switch(a.dataset.act){
    case "scan":openSourceChooser();break;
    case "menu":openMenu();break;
    case "camera":pickImage(f=>Scan.start(f,"camera"),"camera");break;
    case "gallery":pickImage(f=>Scan.start(f,"gallery"),"gallery");break;
    case "add":openForm();break;
    case "today":state.anchor=today();render();break;
    case "demo":loadDemo();break;
    case "clear-demo":liveTx().filter(t=>t.demo).forEach(t=>deleteTx(t.id));render();toast("Data contoh dihapus");break;
    case "suggest-budget":suggestBudget();break;
    case "export-csv":{const r=range(state.mode,state.anchor);download(`luna-transaksi-${state.book}-${r.start}_${r.end}.csv`,"\ufeff"+toCSV(txIn(r)),"text/csv;charset=utf-8");break}
    case "export-cash":{const r=range(state.mode,state.anchor);download(`luna-arus-kas-${state.mode}-${state.book}-${r.start}_${r.end}.csv`,"\ufeff"+cashCSV(),"text/csv;charset=utf-8");break}
    case "export-all-csv":download(`luna-semua-transaksi-${today()}.csv`,"\ufeff"+toCSV(liveTx()),"text/csv;charset=utf-8");break;
    case "export-json":download(`luna-cadangan-${today()}.json`,JSON.stringify({app:"Luna Money Tool",v:2,exported:new Date().toISOString(),tx:state.tx,profile:state.profile},null,1),"application/json");break;
    case "import":$("#importInput").value="";$("#importInput").click();break;
    case "print":window.print();break;
    case "lock":Auth.lock();break;
    case "logout":logoutDialog();break;
    case "set-pin":setPinDialog();break;
    case "del-pin":{const ac=Auth.acc;ac.pin=null;Auth.put(ac);render();toast("PIN dihapus");break}
    case "change-pw":changePwDialog();break;
    case "delete-account":deleteAccountDialog();break;
    case "relogin":dialog("Masuk ulang ke cloud",Gate.pwField("dPw","Kata sandi","current-password"),async()=>{await verifyPw($("#dPw").value);await Sync.ensure();const r=await Sync.client.auth.signInWithPassword({email:Auth.acc.email,password:$("#dPw").value});if(r.error)throw new Error("Tidak bisa masuk ke cloud: "+r.error.message);Sync.user=r.data.user;closeModal();await Sync.pull();Sync.markAll();await Sync.push();render();toast("Sinkron aktif kembali")},"Masuk");break;
    case "sync-now":await Sync.pull();Sync.markAll();await Sync.push();toast("Sinkron selesai");break;
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#modalRoot").innerHTML)closeModal();const ed=e.target.closest?.(".tx[data-edit]");if(ed&&(e.key==="Enter"||e.key===" ")){e.preventDefault();ed.click()}});
$("#settingsBtn").addEventListener("click",()=>Auth.key&&go("settings"));
$("#importInput").addEventListener("change",e=>{const f=e.target.files?.[0];if(f)importFile(f).catch(err=>toast("Gagal impor: "+err.message))});
window.addEventListener("pagehide",()=>{if(Auth.key)persistNow()});

/* ---------------- Mulai ---------------- */
async function boot(){
  chartDefaults();
  if(!window.isSecureContext||!window.crypto||!crypto.subtle){Gate.show("fatal",{msg:"Luna harus dibuka melalui alamat <b>https://</b> agar enkripsi dan kamera berfungsi. Aktifkan SSL di hosting Anda, lalu buka ulang."});return}
  const authHash=/access_token|type=recovery|error_description/.test(location.hash);
  if(CLOUD&&authHash){try{await Sync.ensure();await new Promise(r=>setTimeout(r,400))}catch(e){}}
  if(Sync.recovery) return; // layar atur ulang kata sandi sudah tampil
  if(authHash){try{history.replaceState(null,"",location.pathname)}catch(e){}}
  const accs=Object.values(Auth.list());
  if(accs.length){const last=accs.sort((a,b)=>(b.lastLogin||0)-(a.lastLogin||0))[0];Gate.show("unlock",{accId:last.id})}
  else Gate.show(localStorage.getItem("luna.v1")?"register":"login");
}
boot();
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
